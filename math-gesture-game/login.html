<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Math Gesture Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', 'Baloo 2', sans-serif;
            background: linear-gradient(135deg, #FFD93D 0%, #6BCF7F 50%, #4D96FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50px; left: -50px; right: -50px; bottom: -50px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.3) 0%, transparent 50%);
            animation: floatClouds 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatClouds {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .auth-box {
            background: linear-gradient(135deg, #FFE5F1, #FFF4E0);
            border-radius: 40px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 8px solid rgba(255,255,255,0.9);
        }

        .auth-header h1 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 42px;
            text-align: center;
            margin-bottom: 10px;
            color: #FF6B9D;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
        }

        .auth-header p {
            text-align: center;
            font-size: 20px;
            color: #666;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #555;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 4px solid rgba(255,255,255,0.8);
            border-radius: 25px;
            font-size: 16px;
            font-family: 'Quicksand', sans-serif;
            background: white;
            transition: all 0.3s;
            font-weight: 600;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF6B9D;
            box-shadow: 0 0 0 3px rgba(255,107,157,0.2);
        }

        .error-message, .success-message {
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .error-message {
            background: linear-gradient(135deg, #FFABAB, #FFD6A5);
            color: #c62828;
        }

        .success-message {
            background: linear-gradient(135deg, #A8E6CF, #DCEDC8);
            color: #2e7d32;
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Baloo 2', sans-serif;
            cursor: pointer;
            background: linear-gradient(135deg, #FF6B9D, #FEC163);
            color: white;
            box-shadow: 0 8px 25px rgba(255,107,157,0.4);
            border: 5px solid rgba(255,255,255,0.7);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 35px rgba(255,107,157,0.6);
        }

        .btn-primary:active {
            transform: translateY(-2px) scale(0.98);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 25px;
            font-size: 16px;
            color: #666;
            font-weight: 600;
        }

        .auth-toggle a {
            color: #FF6B9D;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
        }

        .auth-toggle a:hover {
            color: #FEC163;
            text-decoration: underline;
        }

        .auth-back {
            text-align: center;
            margin-top: 20px;
        }

        .auth-back a {
            color: #56CCF2;
            font-weight: 700;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s;
        }

        .auth-back a:hover {
            color: #A8E6CF;
        }

        @media (max-width: 768px) {
            .auth-box { padding: 35px 25px; }
            .auth-header h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>✋ Math Gesture Game</h1>
                <p id="auth-subtitle">Đăng nhập để bắt đầu</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                </div>

                <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                    <label for="confirmPassword">Nhập lại mật khẩu</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu">
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>

                <button type="submit" class="btn-primary" id="authButton">Đăng Nhập</button>
            </form>

            <div class="auth-toggle">
                <p id="toggleText">Chưa có tài khoản? <a href="#" id="toggleLink">Đăng ký ngay</a></p>
            </div>

            <div class="auth-back">
                <a href="index.html">← Về trang chủ</a>
            </div>
        </div>
    </div>

    <!-- ✅ LOGIC GIỮ NGUYÊN 100% -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
