<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Math Gesture Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFD93D 0%, #6BCF7F 50%, #4D96FF 100%);
            min-height: 100vh;
            position: relative;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50px; left: -50px; right: -50px; bottom: -50px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.35) 0%, transparent 50%);
            animation: floatClouds 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatClouds {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        .header {
            background: linear-gradient(135deg, #FF6B9D 0%, #FEC163 100%);
            padding: 25px 40px;
            box-shadow: 0 8px 25px rgba(255,107,157,0.4);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-family: 'Bubblegum Sans', sans-serif;
            font-size: 36px;
            color: white;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info span {
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 25px;
            border: 3px solid rgba(255,255,255,0.5);
        }

        .btn-logout {
            background: linear-gradient(135deg, #FF6B6B, #FFE66D);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,107,107,0.4);
            border: 4px solid rgba(255,255,255,0.5);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .btn-logout:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255,107,107,0.6);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 5;
        }

        .welcome-section {
            background: linear-gradient(135deg, #FFE5F1, #FFF4E0);
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            margin-bottom: 35px;
            box-shadow: 0 15px 40px rgba(255,107,157,0.3);
            border: 8px solid rgba(255,255,255,0.9);
        }

        .welcome-section h2 {
            font-family: 'Bubblegum Sans', sans-serif;
            font-size: 42px;
            color: #FF6B9D;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
        }

        .welcome-section p {
            font-size: 22px;
            color: #666;
            font-weight: 600;
        }

        .level-card {
            background: linear-gradient(135deg, #A8E6CF, #56CCF2);
            border-radius: 40px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(86,204,242,0.4);
            border: 8px solid rgba(255,255,255,0.9);
            margin-bottom: 25px;
        }

        .level-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 50px rgba(86,204,242,0.6);
        }

        .level-card:active {
            transform: translateY(-5px) scale(0.98);
        }

        .level-card.easy {
            background: linear-gradient(135deg, #A8E6CF, #DCEDC8);
        }

        .level-card.medium {
            background: linear-gradient(135deg, #FFD93D, #FEC163);
        }

        .level-card.hard {
            background: linear-gradient(135deg, #FF6B9D, #FEC1D9);
        }

        .level-icon {
            font-size: 64px;
            margin-bottom: 15px;
            animation: levelBounce 2s ease-in-out infinite;
        }

        @keyframes levelBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .level-card h2 {
            font-family: 'Bubblegum Sans', sans-serif;
            font-size: 32px;
            color: white;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .level-card p {
            font-size: 18px;
            color: white;
            font-weight: 600;
            margin: 10px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .high-score {
            font-size: 22px !important;
            font-weight: 800 !important;
            margin-top: 15px !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
            border: 5px solid rgba(255,255,255,0.7);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 35px rgba(102,126,234,0.6);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .action-btn {
            background: linear-gradient(135deg, #56CCF2, #A8E6CF);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 35px;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(86,204,242,0.4);
            border: 6px solid rgba(255,255,255,0.8);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .action-btn:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 40px rgba(86,204,242,0.6);
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; padding: 20px; }
            .header h1 { font-size: 28px; }
            .welcome-section h2 { font-size: 32px; }
            .level-card h2 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 Math Gesture Game</h1>
        <div class="user-info">
            <span id="userName">Loading...</span>
            <button class="btn-logout" id="btnLogout">Đăng xuất</button>
        </div>
    </div>

    <div class="container">
        <div class="welcome-section">
            <h2>Chào mừng trở lại!</h2>
            <p>Chọn cấp độ để bắt đầu chơi</p>
        </div>

        <div class="level-card easy" onclick="playLevel(1)">
            <div class="level-icon">🟢</div>
            <h2>Level 1: Dễ</h2>
            <p>16 câu - Phép tính 2 số</p>
            <p class="high-score">Điểm cao: <span id="level1Score">0</span>%</p>
            <button class="btn-primary">Chơi Ngay!</button>
        </div>

        <div class="level-card medium" onclick="playLevel(2)">
            <div class="level-icon">🟡</div>
            <h2>Level 2: Trung Bình</h2>
            <p>16 câu - Phép tính 3 số</p>
            <p class="high-score">Điểm cao: <span id="level2Score">0</span>%</p>
            <button class="btn-primary">Chơi Ngay!</button>
        </div>

        <div class="level-card hard" onclick="playLevel(3)">
            <div class="level-icon">🔴</div>
            <h2>Level 3: Khó</h2>
            <p>16 câu - Phép tính 4 số</p>
            <p class="high-score">Điểm cao: <span id="level3Score">0</span>%</p>
            <button class="btn-primary">Chơi Ngay!</button>
        </div>

        <div class="action-buttons">
            <button class="action-btn" onclick="window.location.href='history.html'">
                📜 Lịch Sử
            </button>
        </div>
    </div>

    <!-- ✅ LOGIC GIỮ NGUYÊN 100% -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>

    <script>
        const auth = window.auth;
        const db = window.db;

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            console.log('✅ User:', user.email);
            document.getElementById('userName').textContent = user.email.split('@')[0];
            await loadHighScores(user.uid);
        });

        async function loadHighScores(userId) {
            try {
                const userDoc = await db.collection('users').doc(userId).get();
                if (userDoc.exists) {
                    const data = userDoc.data();
                    document.getElementById('level1Score').textContent = data.level1HighScore || 0;
                    document.getElementById('level2Score').textContent = data.level2HighScore || 0;
                    document.getElementById('level3Score').textContent = data.level3HighScore || 0;
                }
            } catch (error) {
                console.error('Lỗi load high scores:', error);
            }
        }

        function playLevel(level) {
            window.location.href = `game.html?level=${level}`;
        }

        document.getElementById('btnLogout').addEventListener('click', () => {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                auth.signOut().then(() => {
                    console.log('✅ Đã đăng xuất');
                    window.location.href = 'login.html';
                }).catch((error) => {
                    console.error('Lỗi đăng xuất:', error);
                });
            }
        });
    </script>
</body>
</html>
