<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Math Gesture Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFD93D 0%, #6BCF7F 50%, #4D96FF 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #FF6B9D, #FEC163);
            padding: 30px;
            text-align: center;
            border-radius: 50px;
            box-shadow: 0 15px 50px rgba(255, 107, 157, 0.3);
            margin-bottom: 30px;
            border: 10px solid rgba(255,255,255,0.5);
        }

        .header h1 {
            font-family: 'Baloo 2', cursive;
            color: white;
            font-size: 2.5rem;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .user-info {
            font-family: 'Quicksand', sans-serif;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .config-section {
            background: white;
            border-radius: 50px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            border: 10px solid rgba(255,255,255,0.5);
            margin-bottom: 30px;
        }

        .config-section h2 {
            font-family: 'Baloo 2', cursive;
            color: #FF6B9D;
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .config-row {
            margin-bottom: 30px;
        }

        .config-row label {
            display: block;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.3rem;
            color: #333;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .config-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .option-btn {
            font-family: 'Quicksand', sans-serif;
            padding: 15px 30px;
            border: 4px solid #E0E0E0;
            border-radius: 30px;
            background: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .option-btn.active {
            background: linear-gradient(135deg, #6BCF7F, #4D96FF);
            color: white;
            border-color: #4D96FF;
            box-shadow: 0 8px 25px rgba(77, 150, 255, 0.4);
        }

        input[type="number"] {
            font-family: 'Baloo 2', cursive;
            width: 150px;
            padding: 15px;
            border: 4px solid #E0E0E0;
            border-radius: 25px;
            font-size: 1.5rem;
            text-align: center;
            color: #4D96FF;
            font-weight: 700;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #4D96FF;
            box-shadow: 0 0 15px rgba(77, 150, 255, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .btn {
            font-family: 'Quicksand', sans-serif;
            padding: 20px 40px;
            border: none;
            border-radius: 35px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 5px solid rgba(255,255,255,0.4);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFD93D, #6BCF7F);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #FF6B9D, #FEC163);
            color: white;
        }

        .btn-logout {
            background: linear-gradient(135deg, #C44569, #FF6B9D);
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .config-options { flex-direction: column; }
            .option-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 Math Gesture Game</h1>
        <div class="user-info">Xin chào, <span id="userEmail">...</span>!</div>
    </div>

    <div class="container">
        <div class="config-section">
            <h2>⚙️ Tùy Chỉnh Trò Chơi</h2>

            <div class="config-row">
                <label>📝 Số câu hỏi:</label>
                <input type="number" id="questionCount" min="1" max="15" value="10">
            </div>

            <div class="config-row">
                <label>🔢 Phép tính:</label>
                <div class="config-options">
                    <button class="option-btn active" data-operation="add">➕ Cộng</button>
                    <button class="option-btn" data-operation="subtract">➖ Trừ</button>
                </div>
            </div>

            <div class="config-row">
                <label>📊 Phạm vi đáp án:</label>
                <div class="config-options">
                    <button class="option-btn active" data-range="0-5">0 - 5</button>
                    <button class="option-btn" data-range="5-10">5 - 10</button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="startGame()">🚀 Bắt Đầu Chơi</button>
                <button class="btn btn-secondary" onclick="goToHistory()">📜 Lịch Sử</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Đăng Xuất</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>

    <script>
        // ===== SOUND EFFECTS =====
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                oscillator.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } else if (type === 'select') {
                oscillator.frequency.setValueAtTime(600, now);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                oscillator.start(now);
                oscillator.stop(now + 0.15);
            }
        }

        function waitForFirebase(callback) {
            if (typeof firebase !== 'undefined' && firebase.auth && firebase.firestore) {
                callback();
            } else {
                setTimeout(() => waitForFirebase(callback), 100);
            }
        }

        waitForFirebase(() => {
            let selectedOperation = 'add';
            let selectedRange = '0-5';

            firebase.auth().onAuthStateChanged(user => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                document.getElementById('userEmail').textContent = user.email;
            });

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    playSound('select'); // 🔊 ÂM THANH CHỌN
                    const group = this.parentElement;
                    group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    if (this.dataset.operation) {
                        selectedOperation = this.dataset.operation;
                    }
                    if (this.dataset.range) {
                        selectedRange = this.dataset.range;
                    }
                });
            });

            window.startGame = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                const questions = document.getElementById('questionCount').value;
                if (questions < 1 || questions > 15) {
                    alert('Số câu hỏi phải từ 1 đến 15!');
                    return;
                }
                const url = `game.html?questions=${questions}&operation=${selectedOperation}&range=${selectedRange}`;
                window.location.href = url;
            };

            window.goToHistory = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                window.location.href = 'history.html';
            };

            window.logout = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                firebase.auth().signOut().then(() => {
                    window.location.href = 'login.html';
                });
            };
        });
    </script>
</body>
</html>
