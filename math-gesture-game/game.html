<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chơi Game - Math Gesture</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFD93D 0%, #6BCF7F 50%, #4D96FF 100%);
            min-height: 100vh;
            overflow: auto;
            padding-bottom: 30px;
        }

        .game-header {
            background: linear-gradient(135deg, #FF6B9D, #FEC163);
            padding: 20px;
            text-align: center;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 10px 40px rgba(255, 107, 157, 0.3);
            margin-bottom: 20px;
        }

        .game-header h1 {
            font-family: 'Baloo 2', cursive;
            color: white;
            font-size: 2rem;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .video-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 50px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            border: 10px solid rgba(255,255,255,0.5);
        }

        .video-wrapper {
            position: relative;
            border-radius: 40px;
            overflow: hidden;
            background: #1a1a2e;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.3);
        }

        #videoElement {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }

        #canvasElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .finger-display {
            margin-top: 20px;
            background: linear-gradient(135deg, #A8E6CF, #FFD3B6);
            padding: 20px;
            border-radius: 35px;
            text-align: center;
            border: 6px solid rgba(255,255,255,0.6);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .finger-display h3 {
            font-family: 'Baloo 2', cursive;
            color: #FF6B9D;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        #fingerCount {
            font-family: 'Baloo 2', cursive;
            font-size: 5rem;
            color: #4D96FF;
            text-shadow: 3px 3px 8px rgba(77, 150, 255, 0.3);
            animation: fingerPulse 1s ease-in-out infinite;
        }

        @keyframes fingerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .game-section {
            flex: 1;
            min-width: 300px;
        }

        .question-card {
            background: white;
            border-radius: 50px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            border: 10px solid rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }

        #questionText {
            font-family: 'Baloo 2', cursive;
            font-size: 4rem;
            color: #FF6B9D;
            text-shadow: 3px 3px 8px rgba(255, 107, 157, 0.3);
            margin: 20px 0;
        }

        #questionNumber {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.3rem;
            color: #6BCF7F;
            font-weight: 600;
        }

        .progress-bar-container {
            background: rgba(255,255,255,0.5);
            height: 30px;
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0;
            border: 4px solid rgba(255,255,255,0.8);
            box-shadow: inset 0 3px 10px rgba(0,0,0,0.1);
        }

        #progressBar {
            height: 100%;
            background: linear-gradient(90deg, #FFD93D, #6BCF7F, #4D96FF);
            transition: width 0.5s ease;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(107, 207, 127, 0.5);
        }

        #feedback {
            min-height: 60px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.8rem;
            margin: 20px 0;
            font-weight: 700;
        }

        .correct { color: #6BCF7F; animation: feedbackBounce 0.5s; }
        .wrong { color: #FF6B9D; animation: shake 0.5s; }

        @keyframes feedbackBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .game-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: 'Quicksand', sans-serif;
            padding: 18px 35px;
            border: none;
            border-radius: 35px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 5px solid rgba(255,255,255,0.4);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .btn-skip { background: linear-gradient(135deg, #FF6B9D, #FEC163); color: white; }
        .btn-hint { background: linear-gradient(135deg, #6BCF7F, #4D96FF); color: white; }
        .btn-finish { background: linear-gradient(135deg, #FFD93D, #6BCF7F); color: white; }
        .btn-exit { background: linear-gradient(135deg, #FF6B9D, #C44569); color: white; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex !important; }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.3);
            border: 10px solid rgba(255,255,255,0.5);
        }

        .modal-content h2 {
            font-family: 'Baloo 2', cursive;
            font-size: 3rem;
            color: #FF6B9D;
            margin-bottom: 30px;
        }

        .stats {
            margin: 30px 0;
            font-family: 'Quicksand', sans-serif;
        }

        .stats p {
            font-size: 1.5rem;
            margin: 15px 0;
            color: #333;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .game-container { flex-direction: column; }
            #questionText { font-size: 3rem; }
            #fingerCount { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="game-header">
        <h1>🎮 Math Gesture Game</h1>
    </div>

    <div class="game-container">
        <div class="video-section">
            <div class="video-wrapper">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="canvasElement"></canvas>
            </div>
            <div class="finger-display">
                <h3>Số ngón tay</h3>
                <div id="fingerCount">0</div>
            </div>
        </div>

        <div class="game-section">
            <div class="question-card">
                <div id="questionNumber">Câu 1/10</div>
                <div id="questionText">2 + 3 = ?</div>
                <div class="progress-bar-container">
                    <div id="progressBar" style="width: 0%"></div>
                </div>
                <div id="feedback"></div>
            </div>

            <div class="game-controls">
                <button class="btn btn-skip" onclick="skipQuestion()">⏭️ Bỏ qua</button>
                <button class="btn btn-hint" onclick="showHint()">💡 Gợi ý</button>
                <button class="btn btn-finish" onclick="finishGame()">🏁 Hoàn thành</button>
                <button class="btn btn-exit" onclick="exitGame()">🚪 Thoát</button>
            </div>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2>🎉 Kết Quả</h2>
            <div class="stats">
                <p>⭐ Điểm: <span id="finalScore">0</span>%</p>
                <p>✅ Đúng: <span id="correctCount">0</span></p>
                <p>❌ Sai: <span id="wrongCount">0</span></p>
                <p>⏱️ Thời gian: <span id="totalTime">0</span>s</p>
            </div>
            <div class="game-controls">
                <button class="btn btn-finish" onclick="goToDashboard()">🏠 Về Trang Chính</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <script>
        console.log('📦 Loading gesture.js...');
    </script>
    <script src="js/gesture.js"></script>

    <script>
        // ===== SOUND EFFECTS =====
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                // ✅ ÂM THANH ĐÚNG - Vui vẻ, cao
                oscillator.frequency.setValueAtTime(523.25, now); // C5
                oscillator.frequency.setValueAtTime(659.25, now + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                oscillator.start(now);
                oscillator.stop(now + 0.4);
            } else if (type === 'wrong') {
                // ❌ ÂM THANH SAI - Thấp, buồn
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.setValueAtTime(200, now + 0.15);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'click') {
                // 🔘 ÂM THANH NÚT BẤM - Click ngắn
                oscillator.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } else if (type === 'start') {
                // 🚀 ÂM THANH BẮT ĐẦU - Năng động
                oscillator.frequency.setValueAtTime(440, now);
                oscillator.frequency.setValueAtTime(554.37, now + 0.1);
                oscillator.frequency.setValueAtTime(659.25, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                oscillator.start(now);
                oscillator.stop(now + 0.4);
            }
        }

        function waitForFirebase(callback) {
            if (typeof firebase !== 'undefined' && firebase.auth && firebase.firestore) {
                callback();
            } else {
                setTimeout(() => waitForFirebase(callback), 100);
            }
        }

        function waitForMediaPipe(callback) {
            if (typeof Hands !== 'undefined' && typeof Camera !== 'undefined') {
                console.log('✅ MediaPipe SDK loaded');
                callback();
            } else {
                console.log('⏳ Chờ MediaPipe SDK...');
                setTimeout(() => waitForMediaPipe(callback), 100);
            }
        }

        waitForFirebase(() => {
        waitForMediaPipe(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const totalQuestions = parseInt(urlParams.get('questions')) || 10;
            const operationType = urlParams.get('operation') || 'add';
            const rangeType = urlParams.get('range') || '0-5';

            let currentQuestion = 0;
            let correctAnswers = 0;
            let wrongAnswers = 0;
            let startTime = Date.now();
            let questions = [];
            let gestureRecognition = null;
            
            let stableCount = 0;
            let stableTarget = 0;
            let stableStartTime = 0;
            const STABLE_DURATION = 1500;
            let isWaitingForHand = true;
            let lastDetectedFingers = 0;

            function generateQuestions() {
                questions = [];
                const [min, max] = rangeType === '0-5' ? [0, 5] : [5, 10];
                
                for (let i = 0; i < totalQuestions; i++) {
                    let a, b, answer;
                    
                    if (operationType === 'add') {
                        answer = Math.floor(Math.random() * (max - min + 1)) + min;
                        a = Math.floor(Math.random() * (answer + 1));
                        b = answer - a;
                    } else {
                        answer = Math.floor(Math.random() * (max - min + 1)) + min;
                        a = answer + Math.floor(Math.random() * (max - answer + 1));
                        b = a - answer;
                    }
                    
                    questions.push({
                        num1: a,
                        num2: b,
                        operator: operationType === 'add' ? '+' : '-',
                        answer: answer
                    });
                }
            }

            function displayQuestion() {
                if (currentQuestion >= totalQuestions) {
                    endGame();
                    return;
                }

                const q = questions[currentQuestion];
                document.getElementById('questionNumber').textContent = `Câu ${currentQuestion + 1}/${totalQuestions}`;
                document.getElementById('questionText').textContent = `${q.num1} ${q.operator} ${q.num2} = ?`;
                document.getElementById('feedback').textContent = '';
                
                const progress = ((currentQuestion) / totalQuestions) * 100;
                document.getElementById('progressBar').style.width = progress + '%';

                isWaitingForHand = true;
                stableCount = 0;
                stableStartTime = 0;
                console.log('🔄 Câu mới - Chờ tay giơ lên...');
            }

            function checkAnswer(fingers) {
                const q = questions[currentQuestion];
                const feedback = document.getElementById('feedback');

                if (fingers === q.answer) {
                    playSound('correct'); // 🔊 ÂM THANH ĐÚNG
                    feedback.textContent = '🎉 Chính xác!';
                    feedback.className = 'correct';
                    correctAnswers++;
                    console.log('✅ Đúng! Chờ 2s...');
                    
                    setTimeout(() => {
                        currentQuestion++;
                        displayQuestion();
                    }, 2000);
                } else {
                    playSound('wrong'); // 🔊 ÂM THANH SAI
                    feedback.textContent = `❌ Sai rồi! Đáp án: ${q.answer}`;
                    feedback.className = 'wrong';
                    wrongAnswers++;
                    console.log('❌ Sai! Chờ 2s...');
                    
                    setTimeout(() => {
                        currentQuestion++;
                        displayQuestion();
                    }, 2000);
                }
            }

            function onFingerCountUpdate(count) {
                document.getElementById('fingerCount').textContent = count;
                lastDetectedFingers = count;

                if (isWaitingForHand) {
                    if (count > 0) {
                        console.log('👋 Bắt đầu giơ tay - Số ngón:', count);
                        isWaitingForHand = false;
                        stableTarget = count;
                        stableCount = 0;
                        stableStartTime = Date.now();
                    }
                    return;
                }

                if (count === stableTarget) {
                    const elapsed = Date.now() - stableStartTime;
                    if (elapsed >= STABLE_DURATION && stableCount === 0) {
                        console.log(`✅ Giữ ổn định ${STABLE_DURATION}ms - Ghi nhận: ${count}`);
                        stableCount = 1;
                        checkAnswer(count);
                    }
                } else {
                    if (count > 0) {
                        console.log(`🔄 Đổi từ ${stableTarget} → ${count}, reset timer`);
                        stableTarget = count;
                        stableStartTime = Date.now();
                        stableCount = 0;
                    }
                }
            }

            window.skipQuestion = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                wrongAnswers++;
                currentQuestion++;
                displayQuestion();
            };

            window.showHint = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                const q = questions[currentQuestion];
                alert(`💡 Gợi ý: Đáp án từ ${q.answer - 1} đến ${q.answer + 1}`);
            };

            window.finishGame = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                if (confirm('Bạn có chắc muốn kết thúc sớm?')) {
                    endGame();
                }
            };

            window.exitGame = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                if (confirm('Thoát game? Kết quả sẽ không được lưu.')) {
                    window.location.href = 'dashboard.html';
                }
            };

            function endGame() {
                const totalTime = Math.floor((Date.now() - startTime) / 1000);
                const totalAnswered = correctAnswers + wrongAnswers;
                const score = totalAnswered > 0 ? Math.round((correctAnswers / totalAnswered) * 100) : 0;

                document.getElementById('finalScore').textContent = score;
                document.getElementById('correctCount').textContent = correctAnswers;
                document.getElementById('wrongCount').textContent = wrongAnswers;
                document.getElementById('totalTime').textContent = totalTime;

                const user = firebase.auth().currentUser;
                if (user) {
                    firebase.firestore().collection('gameHistory').add({
                        userId: user.uid,
                        questions: totalQuestions,
                        operation: operationType,
                        range: rangeType,
                        score: score,
                        correctAnswers: correctAnswers,
                        wrongAnswers: wrongAnswers,
                        timeSpent: totalTime,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        timestampClient: new Date()
                    }).then(() => {
                        console.log('✅ Đã lưu kết quả');
                    });
                }

                document.getElementById('resultModal').classList.add('show');
            }

            window.goToDashboard = function() {
                playSound('click'); // 🔊 ÂM THANH NÚT
                window.location.href = 'dashboard.html';
            };

            window.addEventListener('load', () => {
                firebase.auth().onAuthStateChanged(user => {
                    if (!user) {
                        window.location.href = 'login.html';
                        return;
                    }

                    generateQuestions();
                    displayQuestion();
                    playSound('start'); // 🔊 ÂM THANH BẮT ĐẦU GAME

                    const video = document.getElementById('videoElement');
                    const canvas = document.getElementById('canvasElement');

                    navigator.mediaDevices.getUserMedia({ 
                        video: { width: 640, height: 480 } 
                    }).then(stream => {
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            
                            console.log('🎥 Video ready:', video.videoWidth, 'x', video.videoHeight);
                            
                            // ✅ KIỂM TRA GestureRecognition class
                            if (typeof GestureRecognition === 'undefined') {
                                console.error('❌ GestureRecognition class không tồn tại!');
                                alert('Lỗi: File js/gesture.js chưa load. Vui lòng refresh trang.');
                                return;
                            }
                            
                            console.log('🚀 Khởi tạo GestureRecognition...');
                            gestureRecognition = new GestureRecognition(
                                video, 
                                canvas, 
                                onFingerCountUpdate
                            );
                            
                            console.log('✅ Camera sẵn sàng');
                        };
                    }).catch(err => {
                        console.error('❌ Camera error:', err);
                        alert('Không thể truy cập camera: ' + err.message);
                    });
                });
            });
        });
        });
    </script>
</body>
</html>
