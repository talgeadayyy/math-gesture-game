<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử - Math Gesture Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', 'Baloo 2', sans-serif;
            background: linear-gradient(135deg, #FFD93D 0%, #6BCF7F 50%, #4D96FF 100%);
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50px; left: -50px; right: -50px; bottom: -50px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.3) 0%, transparent 50%);
            animation: floatClouds 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatClouds {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        .header {
            background: linear-gradient(135deg, #FF6B9D 0%, #FEC163 100%);
            padding: 25px 40px;
            box-shadow: 0 8px 25px rgba(255,107,157,0.4);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 36px;
            color: white;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info span {
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 25px;
            border: 3px solid rgba(255,255,255,0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #A8E6CF, #56CCF2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(86,204,242,0.4);
            border: 4px solid rgba(255,255,255,0.5);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .btn-secondary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(86,204,242,0.6);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            padding-bottom: 80px;
            position: relative;
            z-index: 5;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #FFE5F1, #FFF4E0);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 6px solid rgba(255,255,255,0.9);
            transition: all 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .stat-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: 'Baloo 2', sans-serif;
            font-size: 36px;
            font-weight: 800;
            color: #FF6B9D;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 16px;
            color: #666;
            font-weight: 700;
        }

        .history-filters {
            background: linear-gradient(135deg, #A8E6CF, #56CCF2);
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(86,204,242,0.3);
            border: 6px solid rgba(255,255,255,0.9);
        }

        .filter-group label {
            display: block;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .filter-group select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 20px;
            border: 4px solid rgba(255,255,255,0.8);
            font-size: 16px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            background: white;
        }

        .history-container {
            background: linear-gradient(135deg, #FFE5F1, #FFF4E0);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 6px solid rgba(255,255,255,0.9);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .history-header h2 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 32px;
            color: #FF6B9D;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B9D, #FEC163);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,107,157,0.4);
            border: 4px solid rgba(255,255,255,0.7);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255,107,157,0.6);
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 24px;
            color: #FF6B9D;
            font-weight: 700;
        }

        .spinner {
            border: 6px solid rgba(255,107,157,0.3);
            border-top: 6px solid #FF6B9D;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 32px;
            color: #FF6B9D;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 18px;
            color: #666;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .history-list {
            display: grid;
            gap: 20px;
        }

        .history-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 5px solid rgba(255,255,255,0.9);
            transition: all 0.3s;
        }

        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .card-body {
            padding: 25px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 25px;
            align-items: center;
        }

        .card-score {
            text-align: center;
        }

        .score-big {
            font-family: 'Baloo 2', sans-serif;
            font-size: 48px;
            font-weight: 800;
        }

        .score-label {
            font-size: 16px;
            color: #666;
            font-weight: 700;
            margin-top: 5px;
        }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat {
            background: #f5f7fa;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: 'Baloo 2', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #333;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            font-weight: 700;
            margin-top: 5px;
        }

        .card-details {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            font-weight: 700;
            color: #555;
        }

        .detail-item {
            text-align: center;
        }

        .detail-item span {
            display: block;
            font-family: 'Baloo 2', sans-serif;
            font-size: 18px;
            color: #4D96FF;
            margin-top: 5px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            font-size: 20px;
            color: #666;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .stats-summary { grid-template-columns: 1fr 1fr; }
            .history-filters { grid-template-columns: 1fr; }
            .card-body { grid-template-columns: 1fr; }
            .card-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📜 Lịch Sử Làm Bài</h1>
        <div class="user-info">
            <span id="userName">Loading...</span>
            <button class="btn-secondary" id="btnBack">← Về Trang Chính</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-summary">
            <div class="stat-box">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalGames">0</div>
                <div class="stat-label">Tổng số bài</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">⭐</div>
                <div class="stat-value" id="avgScore">0%</div>
                <div class="stat-label">Điểm trung bình</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="bestScore">0%</div>
                <div class="stat-label">Điểm cao nhất</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value" id="totalTime">0</div>
                <div class="stat-label">Tổng thời gian</div>
            </div>
        </div>

        <div class="history-filters">
            <div class="filter-group">
                <label>Lọc theo phép tính:</label>
                <select id="filterOperation">
                    <option value="all">Tất cả</option>
                    <option value="add">Phép cộng (+)</option>
                    <option value="subtract">Phép trừ (-)</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Lọc theo khoảng:</label>
                <select id="filterRange">
                    <option value="all">Tất cả</option>
                    <option value="0-5">Khoảng 0-5</option>
                    <option value="5-10">Khoảng 5-10</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sắp xếp:</label>
                <select id="sortBy">
                    <option value="date-desc">Mới nhất</option>
                    <option value="date-asc">Cũ nhất</option>
                    <option value="score-desc">Điểm cao nhất</option>
                    <option value="score-asc">Điểm thấp nhất</option>
                </select>
            </div>
        </div>

        <div class="history-container">
            <div class="history-header">
                <h2>Lịch Sử Chi Tiết</h2>
                <button class="btn-primary" id="btnClearHistory">Xóa Lịch Sử</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Đang tải dữ liệu...</p>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📭</div>
                <h3>Chưa có lịch sử</h3>
                <p>Bạn chưa chơi game nào. Hãy bắt đầu ngay!</p>
                <button class="btn-primary" onclick="window.location.href='dashboard.html'">Về Trang Chủ</button>
            </div>

            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>

    <script>
        function waitForFirebase(callback) {
            if (typeof firebase !== 'undefined' && firebase.auth && firebase.firestore && window.auth && window.db) {
                callback();
            } else {
                setTimeout(() => waitForFirebase(callback), 100);
            }
        }

        waitForFirebase(() => {
        const auth = window.auth;
        const db = window.db;
        let allHistory = [];
        let currentUser = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                alert('Vui lòng đăng nhập!');
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').textContent = user.email;
            await loadHistory();
        });

        async function loadHistory() {
            try {
                console.log('📊 Đang tải lịch sử...');
                document.getElementById('loading').style.display = 'flex';
                document.getElementById('emptyState').style.display = 'none';

                const snapshot = await db.collection('gameHistory').where('userId', '==', currentUser.uid).get();

                allHistory = [];
                let totalScore = 0;
                let bestScore = 0;
                let totalTimeSpent = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    allHistory.push({
                        id: doc.id,
                        ...data,
                        timestamp: data.timestampClient || data.timestamp?.toDate() || new Date()
                    });
                    totalScore += data.score || 0;
                    if ((data.score || 0) > bestScore) bestScore = data.score || 0;
                    totalTimeSpent += data.timeSpent || 0;
                });

                allHistory.sort((a, b) => b.timestamp - a.timestamp);

                console.log('✅ Đã tải:', allHistory.length, 'bản ghi');

                document.getElementById('totalGames').textContent = allHistory.length;
                document.getElementById('avgScore').textContent = allHistory.length > 0 ? Math.round(totalScore / allHistory.length) + '%' : '0%';
                document.getElementById('bestScore').textContent = bestScore + '%';
                
                const hours = Math.floor(totalTimeSpent / 3600);
                const minutes = Math.floor((totalTimeSpent % 3600) / 60);
                document.getElementById('totalTime').textContent = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;

                document.getElementById('loading').style.display = 'none';

                if (allHistory.length === 0) {
                    document.getElementById('emptyState').style.display = 'flex';
                } else {
                    renderHistory();
                }

            } catch (error) {
                console.error('❌ Lỗi tải lịch sử:', error);
                document.getElementById('loading').style.display = 'none';
                alert('Không thể tải lịch sử. Vui lòng thử lại.');
            }
        }

        function renderHistory() {
            const filterOperation = document.getElementById('filterOperation').value;
            const filterRange = document.getElementById('filterRange').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = allHistory;
            
            if (filterOperation !== 'all') {
                filtered = filtered.filter(item => item.operation === filterOperation);
            }
            
            if (filterRange !== 'all') {
                filtered = filtered.filter(item => item.range === filterRange);
            }

            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'date-desc': return b.timestamp - a.timestamp;
                    case 'date-asc': return a.timestamp - b.timestamp;
                    case 'score-desc': return b.score - a.score;
                    case 'score-asc': return a.score - b.score;
                    default: return 0;
                }
            });

            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            if (filtered.length === 0) {
                historyList.innerHTML = '<div class="no-results">Không tìm thấy kết quả</div>';
                return;
            }

            filtered.forEach((item, index) => {
                const card = createHistoryCard(item, index + 1);
                historyList.appendChild(card);
            });
        }

        function createHistoryCard(item, index) {
            const card = document.createElement('div');
            card.className = 'history-card';

            const operationInfo = {
                'add': { name: 'Phép Cộng', emoji: '➕', color: '#84fab0' },
                'subtract': { name: 'Phép Trừ', emoji: '➖', color: '#fcb69f' }
            };

            const rangeInfo = {
                '0-5': { name: 'Khoảng 0-5', emoji: '🟢' },
                '5-10': { name: 'Khoảng 5-10', emoji: '🔵' }
            };

            const opInfo = operationInfo[item.operation] || { name: 'Unknown', emoji: '❓', color: '#ccc' };
            const rgInfo = rangeInfo[item.range] || { name: 'Unknown', emoji: '❓' };
            const scoreColor = item.score >= 80 ? '#38ef7d' : item.score >= 50 ? '#f7b731' : '#ff6b6b';

            const date = new Date(item.timestamp);
            const dateStr = date.toLocaleDateString('vi-VN');
            const timeStr = date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

            const minutes = Math.floor(item.timeSpent / 60);
            const seconds = item.timeSpent % 60;

            const totalAnswered = (item.correctAnswers || 0) + (item.wrongAnswers || 0);
            const scorePercent = totalAnswered > 0 ? Math.round((item.correctAnswers / totalAnswered) * 100) : 0;

            const starCount = scorePercent >= 90 ? 3 : scorePercent >= 70 ? 2 : scorePercent >= 50 ? 1 : 0;
            const stars = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);

            card.innerHTML = `
                <div class="card-header" style="background: linear-gradient(135deg, ${opInfo.color} 0%, ${opInfo.color}dd 100%);">
                    <div>#${index}</div>
                    <div>${opInfo.emoji} ${opInfo.name} | ${rgInfo.emoji} ${rgInfo.name}</div>
                    <div>${dateStr} ${timeStr}</div>
                </div>
                <div class="card-body">
                    <div class="card-score" style="color: ${scoreColor};">
                        <div class="score-big">${scorePercent}%</div>
                        <div class="score-label">${stars}</div>
                    </div>
                    <div>
                        <div class="card-stats">
                            <div class="stat">
                                <div class="stat-icon">✅</div>
                                <div class="stat-value">${item.correctAnswers || 0}</div>
                                <div class="stat-label">Đúng</div>
                            </div>
                            <div class="stat">
                                <div class="stat-icon">❌</div>
                                <div class="stat-value">${item.wrongAnswers || 0}</div>
                                <div class="stat-label">Sai</div>
                            </div>
                            <div class="stat">
                                <div class="stat-icon">⏱️</div>
                                <div class="stat-value">${minutes}:${String(seconds).padStart(2, '0')}</div>
                                <div class="stat-label">Thời gian</div>
                            </div>
                        </div>
                        <div class="card-details">
                            <div class="detail-item">
                                📝 Số câu hỏi
                                <span>${item.questions || 10}</span>
                            </div>
                            <div class="detail-item">
                                ${opInfo.emoji} Phép tính
                                <span>${opInfo.name}</span>
                            </div>
                            <div class="detail-item">
                                ${rgInfo.emoji} Khoảng
                                <span>${rgInfo.name}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        document.getElementById('filterOperation').addEventListener('change', renderHistory);
        document.getElementById('filterRange').addEventListener('change', renderHistory);
        document.getElementById('sortBy').addEventListener('change', renderHistory);

        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'dashboard.html';
        });

        document.getElementById('btnClearHistory').addEventListener('click', async () => {
            if (!confirm('Bạn có chắc muốn xóa toàn bộ lịch sử? Hành động này không thể hoàn tác!')) return;

            try {
                const batch = db.batch();
                allHistory.forEach((item) => {
                    batch.delete(db.collection('gameHistory').doc(item.id));
                });
                await batch.commit();

                alert('Đã xóa lịch sử thành công!');
                await loadHistory();
            } catch (error) {
                console.error('❌ Lỗi xóa lịch sử:', error);
                alert('Không thể xóa lịch sử. Vui lòng thử lại.');
            }
        });
        }); // ✅ KẾT THÚC waitForFirebase()
    </script>
</body>
</html>
